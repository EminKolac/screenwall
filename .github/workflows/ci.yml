# Tests on every push to main and every pull request.
#
#   backend    pytest on Linux and macOS (uv, Python 3.12, the locked dependencies)
#   frontend   type check, unit tests (vitest) and the production build (Node 22)
#   packaging  quick checks of the release files: shell syntax of the scripts, the
#              Screenwall.app Info.plist template, the icon file, Python syntax. The release
#              workflow (release.yml) builds and smoke-tests the dmg and zip themselves.
#
# Screenwall ships for macOS only, so there is no Windows job. Ruff and the Playwright e2e suite
# are not run yet (ruff is not clean on this tree).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to the same pull request replaces its running checks; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv publishes no floating major tag; pinned to the v10.2.0 commit.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: auto
          cache-dependency-glob: backend/uv.lock

      - name: Install the locked dependencies
        run: uv sync --frozen --python 3.12

      - name: pytest
        run: uv run --frozen pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npm run build

  packaging:
    name: packaging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Shell syntax
        shell: bash
        run: |
          for script in packaging/build_release.sh packaging/smoke_release.sh \
            packaging/macos/Screenwall.command packaging/macos/app/Screenwall; do
            bash -n "$script"
          done
          # install-macos.sh is piped into sh on users' Macs: POSIX sh (dash here) must parse it.
          sh -n packaging/install-macos.sh

      - name: Info.plist template, icon, Python syntax
        shell: bash
        run: |
          python3 - <<'EOF'
          import plistlib
          from pathlib import Path

          raw = Path("packaging/macos/app/Info.plist").read_bytes()
          assert b"@VERSION@" in raw, "Info.plist has no @VERSION@ placeholder"
          info = plistlib.loads(raw.replace(b"@VERSION@", b"0.0.0"))
          expected = {
              "CFBundleIdentifier": "site.screenwall.Screenwall",
              "CFBundleName": "Screenwall",
              "CFBundleDisplayName": "Screenwall",
              "CFBundleExecutable": "Screenwall",
              "CFBundleIconFile": "AppIcon",
              "CFBundlePackageType": "APPL",
              "CFBundleShortVersionString": "0.0.0",
              "LSMinimumSystemVersion": "14.0",
              "NSHighResolutionCapable": True,
          }
          for key, value in expected.items():
              assert info.get(key) == value, f"Info.plist {key} = {info.get(key)!r}, expected {value!r}"
          # arm64 first, or LaunchServices runs the bash entry point under Rosetta.
          assert info.get("LSArchitecturePriority", [None])[0] == "arm64", "LSArchitecturePriority"
          icon = Path("packaging/macos/app/AppIcon.icns").read_bytes()
          assert icon[:4] == b"icns", "AppIcon.icns is not an icns file"
          print("Info.plist template and AppIcon.icns ok")
          EOF
          python3 -m py_compile packaging/smoke_test.py packaging/macos/app/make_icon.py
