# Tests on every push to main and every pull request.
#
#   backend   pytest on Linux, macOS and Windows (uv, Python 3.12, the locked dependencies)
#   frontend  type check, unit tests (vitest) and the production build (Node 22)
#
# Windows is experimental: its backend job may fail without failing the workflow until it is
# green. Ruff and the Playwright e2e suite are not run yet (ruff is not clean on this tree).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to the same pull request replaces its running checks; runs on main all finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Windows is experimental until this job is green there: a failure shows on the run but does
    # not fail the workflow. Set experimental to false once windows-latest passes reliably.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: macos-latest
            experimental: false
          - os: windows-latest
            experimental: true
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv publishes no floating major tag; pinned to the v10.2.0 commit.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: auto
          cache-dependency-glob: backend/uv.lock

      - name: Install the locked dependencies
        run: uv sync --frozen --python 3.12

      - name: pytest
        run: uv run --frozen pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npm run build
