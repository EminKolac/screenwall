# Release: build the macOS disk image (Screenwall.app) and launcher zip, smoke-test both on an
# Apple Silicon and an Intel Mac, then open a DRAFT GitHub release with the assets. A person
# publishes the draft (as a full release, not a prerelease: only then do the
# .../releases/latest/download/<asset> links point at it).
#
#   build    (macos-latest: hdiutil makes the dmg)  UI build + packaging/build_release.sh ->
#            Screenwall-macOS.dmg, Screenwall-macOS.zip, install-macos.sh, SHA256SUMS.txt as one
#            workflow artifact
#   smoke    (macos-latest = Apple Silicon, macos-15-intel = Intel)  packaging/smoke_release.sh:
#            zip  unzip, start Screenwall.command as a user would (no browser, no Ollama), wait
#                 for /health, run packaging/smoke_test.py, stop it
#            dmg  mount the image read-only, check it, copy Screenwall.app out, start it the way
#                 the app does (its Terminal starter, without Terminal) with an empty HOME, the
#                 same checks, and no file in the app may change
#   release  (tags v* only, after every smoke job passed)  gh release create --draft
#
# macOS only: there is no Windows build (the Windows launcher is kept in
# archive/packaging-windows-2026-10-07/). macos-15-intel is GitHub's last Intel (x86_64) macOS
# image, announced as supported until August 2027; drop it from the matrix when it is retired.
#
# Triggers: pushing a tag v* (git tag v0.1.0 && git push origin v0.1.0), "Run workflow" by
# hand, or a pull request that touches the app or its packaging. A manual run on a branch and a
# pull request build and smoke-test but never create a release; the optional version input names
# the build (default 0.0.0-dev.<commit>). The pull request run is the rehearsal: a tag whose
# smoke job fails on either Mac gets no draft at all. Merge only after it passed, then tag.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "backend/**"
      - "frontend/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version written into the assets (empty: the tag name, or 0.0.0-dev.<commit>)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    # macOS: hdiutil (the dmg) exists only there. The zip is the same on Linux and macOS.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Release builds use no dependency caches (cache poisoning); npm ci and uv start clean.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # Only for "uv lock --check" in build_release.sh. No floating major tag; pinned to v10.2.0.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install UI dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the UI
        working-directory: frontend
        run: npm run build

      - name: Build the release assets
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          fi
          if [ -z "$version" ]; then
            version="0.0.0-dev.${GITHUB_SHA:0:7}"
          fi
          # build_release.sh strips a leading "v" and refuses anything but [0-9A-Za-z.+_-].
          bash packaging/build_release.sh "$version"

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Release assets, version $(unzip -p dist/Screenwall-macOS.zip Screenwall/VERSION)"
            echo ''
            echo '| asset | bytes |'
            echo '|---|---:|'
            for asset in Screenwall-macOS.dmg Screenwall-macOS.zip install-macos.sh SHA256SUMS.txt; do
              echo "| $asset | $(wc -c <"dist/$asset" | tr -d ' ') |"
            done
            echo ''
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # Only the four assets: dist/.work and dist/.previous (staging, earlier builds) stay out.
      - uses: actions/upload-artifact@v7
        with:
          name: screenwall-release
          path: |
            dist/Screenwall-macOS.dmg
            dist/Screenwall-macOS.zip
            dist/install-macos.sh
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macos-latest: Apple Silicon (arm64). macos-15-intel: Intel (x86_64).
        os: [macos-latest, macos-15-intel]
    env:
      SCREENWALL_PORT: "8765"
    steps:
      # For packaging/smoke_release.sh and smoke_test.py; the app under test comes from the
      # built assets.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: screenwall-release
          path: dist

      # No uv is set up here: the launcher finds or installs it, as on a user's machine. Folder
      # names with a space on purpose: the default data folder is ".../Application Support/...".

      - name: Show the machine
        shell: bash
        run: |
          # The summary names the architecture each smoke job really ran on.
          echo "$(sw_vers -productName) $(sw_vers -productVersion), $(uname -m)"
          echo "${{ matrix.os }}: $(sw_vers -productName) $(sw_vers -productVersion), $(uname -m)" \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Smoke test, Screenwall-macOS.zip
        shell: bash
        run: SMOKE_DIR="$RUNNER_TEMP/smoke-zip" bash packaging/smoke_release.sh zip

      # Runs even when the zip test failed, so one run reports on both packages.
      - name: Smoke test, Screenwall-macOS.dmg
        if: ${{ !cancelled() }}
        shell: bash
        run: SMOKE_DIR="$RUNNER_TEMP/smoke-dmg" bash packaging/smoke_release.sh dmg

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/smoke-*/*.log
            ${{ runner.temp }}/smoke-*/*.json
          if-no-files-found: warn
          retention-days: 14

  release:
    name: draft release
    needs: smoke
    # Tags only: a manual run on a branch stops after the smoke tests.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: screenwall-release
          path: dist

      - name: Check the assets
        shell: bash
        working-directory: dist
        run: |
          ls -l
          for asset in Screenwall-macOS.dmg Screenwall-macOS.zip install-macos.sh SHA256SUMS.txt; do
            [ -f "$asset" ] || { echo "::error::missing asset $asset"; exit 1; }
          done
          # Exactly these four files are attached to the release (dist/*).
          expected='Screenwall-macOS\.dmg|Screenwall-macOS\.zip|install-macos\.sh|SHA256SUMS\.txt'
          extra="$(ls -A | grep -vxE "$expected" || true)"
          if [ -n "$extra" ]; then
            echo "::error::unexpected files in the release assets: $extra"
            exit 1
          fi
          # Every asset but the checksum file itself is in SHA256SUMS.txt.
          [ "$(wc -l <SHA256SUMS.txt | tr -d ' ')" = 3 ] || {
            echo "::error::SHA256SUMS.txt does not list the three other assets"
            exit 1
          }
          sha256sum -c SHA256SUMS.txt

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release for $TAG already exists; nothing was changed."
            exit 1
          fi
          cat >"$RUNNER_TEMP/notes.md" <<EOF
          Screenwall $TAG: belgelerdeki kişisel verileri kendi bilgisayarınızda maskeleyen uygulama.

          Bu sürüm yalnız macOS içindir: Apple Silicon ve Intel Mac'ler, macOS 14 (Sonoma) veya üstü. Windows desteklenmiyor.

          İndirme ve kurulum adımları README'nin "İndir" bölümünde: $repo_url#indir

          - Screenwall-macOS.dmg: uygulama (önerilen). DMG'yi açın, Screenwall'ı Applications (Uygulamalar) klasörüne sürükleyin ve oradan açın. Bir Terminal penceresi açılır ve ilerlemeyi gösterir; hazır olunca tarayıcıda http://127.0.0.1:8765 açılır. O pencereyi kapatmak (ya da Ctrl+C) Screenwall'ı durdurur. Belgeler, ayarlar ve Python ortamı ~/Library/Application Support/Screenwall klasöründe durur; uygulamanın kendisine bir şey yazılmaz.
          - Screenwall-macOS.zip: aynı uygulama, klasör olarak. Zip'i açın, Screenwall klasöründeki Screenwall.command dosyasına çift tıklayın.
          - install-macos.sh: terminalden kurulum. Zip'i indirir, SHA256SUMS.txt ile doğrular, ~/Screenwall klasörüne kurar ve başlatır.
          - SHA256SUMS.txt: dmg, zip ve install-macos.sh dosyalarının SHA-256 özetleri.

          Ollama zorunlu. Belgeler yalnızca yerel denetçi (Ollama üzerinde çalışan lokal LLM: qwen3.5:4b modeli, yaklaşık 3,4 GB) çalıştığında onaylanabilir; Ollama yoksa uygulama açılır ve belgeleri maskeler, ama hiçbir belge onaylanamaz ve indirilemez. Ollama'yı https://ollama.com/download adresinden kurun; model ilk açılışta kendiliğinden indirilir. İlk açılışta gerekli paketler de indirilir; internet bağlantısı gerekir.

          Intel Mac'lerde Ollama yalnız işlemciyle (CPU) çalışır, denetim daha yavaş olur. Denetçi bir belgeye en fazla 120 saniye ayırır; süre aşılırsa belge incelemede kalır, elle onay da denetimi yeniden çalıştırdığı için süreyi hep aşan bir belge onaylanamaz. Intel'de bu sürenin yetip yetmediği ölçülmedi: Intel için tek test aşağıdaki Ollama'sız duman testi; Intel'de Ollama ile onay hiç denenmedi.

          İlk açılışta macOS uyarısı: uygulama Apple tarafından imzalanmadığı için macOS "açılamadı" ya da "geliştirici doğrulanamadı" diyebilir. Screenwall uygulamasına (zip'te Screenwall.command dosyasına) sağ tıklayın (ya da Control tuşuyla tıklayın) > Aç > Aç. macOS 15 (Sequoia) ve sonrasında bu yol çalışmazsa uyarıyı kapatın, Sistem Ayarları > Gizlilik ve Güvenlik bölümünde Screenwall satırındaki "Yine de Aç" düğmesine basın. Bu yalnızca ilk açılışta gerekir.

          Otomatik duman testi (zip açılır; DMG salt okunur bağlanır ve uygulama kopyalanır; başlatıcı çalıştırılır, sunucu ve örnek bir belge yüklemesi denenir, uygulamanın içinde hiçbir dosyanın değişmediğine bakılır; Ollama ve Terminal penceresi olmadan) GitHub'ın Apple Silicon (macos-latest) ve Intel (macos-15-intel) macOS sunucularında geçti. Bu taslağı oluşturan CI çalışması: $repo_url/actions/runs/$GITHUB_RUN_ID
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Screenwall $TAG" --notes-file "$RUNNER_TEMP/notes.md"
