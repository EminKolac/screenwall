# Release: build the macOS launcher zip, smoke-test it on an Apple Silicon and an Intel Mac,
# then open a DRAFT GitHub release with the assets. A person publishes the draft (as a full
# release, not a prerelease: only then do the .../releases/latest/download/<asset> links point
# at it).
#
#   build    (ubuntu)  UI build + packaging/build_release.sh -> 3 assets as one workflow artifact
#   smoke    (macos-latest = Apple Silicon, macos-15-intel = Intel)  unzip the zip, start the
#            launcher as a user would (no browser, no Ollama), wait for /health, run
#            packaging/smoke_test.py against it
#   release  (tags v* only, after every smoke job passed)  gh release create --draft
#
# macOS only: there is no Windows build (the Windows launcher is kept in
# archive/packaging-windows-2026-10-07/). macos-15-intel is GitHub's last Intel (x86_64) macOS
# image, announced as supported until August 2027; drop it from the matrix when it is retired.
#
# Triggers: pushing a tag v* (git tag v0.1.0 && git push origin v0.1.0), "Run workflow" by
# hand, or a pull request that touches the app or its packaging. A manual run on a branch and a
# pull request build and smoke-test but never create a release; the optional version input names
# the build (default 0.0.0-dev.<commit>). The pull request run is the rehearsal: a tag whose
# smoke job fails on either Mac gets no draft at all. Merge only after it passed, then tag.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - "backend/**"
      - "frontend/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version written into the zips (empty: the tag name, or 0.0.0-dev.<commit>)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Release builds use no dependency caches (cache poisoning); npm ci and uv start clean.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # Only for "uv lock --check" in build_release.sh. No floating major tag; pinned to v10.2.0.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Install UI dependencies
        working-directory: frontend
        run: npm ci

      - name: Build the UI
        working-directory: frontend
        run: npm run build

      - name: Build the release assets
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          fi
          if [ -z "$version" ]; then
            version="0.0.0-dev.${GITHUB_SHA:0:7}"
          fi
          # build_release.sh strips a leading "v" and refuses anything but [0-9A-Za-z.+_-].
          bash packaging/build_release.sh "$version"

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Release assets, version $(unzip -p dist/Screenwall-macOS.zip Screenwall/VERSION)"
            echo ''
            echo '| asset | bytes |'
            echo '|---|---:|'
            for asset in Screenwall-macOS.zip install-macos.sh SHA256SUMS.txt; do
              echo "| $asset | $(wc -c <"dist/$asset" | tr -d ' ') |"
            done
            echo ''
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # Only the three assets: dist/.work and dist/.previous (staging, earlier builds) stay out.
      - uses: actions/upload-artifact@v7
        with:
          name: screenwall-release
          path: |
            dist/Screenwall-macOS.zip
            dist/install-macos.sh
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: smoke (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-latest: Apple Silicon (arm64). macos-15-intel: Intel (x86_64).
        os: [macos-latest, macos-15-intel]
    env:
      SCREENWALL_PORT: "8765"
      SCREENWALL_NO_BROWSER: "1"
      SCREENWALL_SKIP_OLLAMA: "1"
      SW_URL: http://127.0.0.1:8765
    steps:
      # Only for packaging/smoke_test.py; the app under test comes from the built zip.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: screenwall-release
          path: dist

      # Paths with a space on purpose: the default macOS home is ".../Application Support/...".
      # No uv is set up here: the launcher finds or installs it, as on a user's machine.

      - name: Show the machine
        shell: bash
        run: |
          # The summary names the architecture each smoke job really ran on.
          echo "$(sw_vers -productName) $(sw_vers -productVersion), $(uname -m)"
          echo "${{ matrix.os }}: $(sw_vers -productName) $(sw_vers -productVersion), $(uname -m)" \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Unpack Screenwall-macOS.zip
        shell: bash
        run: |
          app_dir="$RUNNER_TEMP/Screenwall app"
          mkdir -p "$app_dir"
          # ditto is what Finder's Archive Utility uses; it keeps the launcher's executable bit.
          ditto -x -k dist/Screenwall-macOS.zip "$app_dir"
          if [ ! -x "$app_dir/Screenwall/Screenwall.command" ]; then
            echo "::error::Screenwall.command is missing or not executable after unzip"
            exit 1
          fi
          {
            echo "SW_APP=$app_dir/Screenwall"
            echo "SCREENWALL_HOME=$RUNNER_TEMP/Screenwall home"
          } >>"$GITHUB_ENV"

      - name: Start the launcher and wait for /health
        shell: bash
        run: |
          launcher_pid=""
          start_launcher() { # start_launcher <attempt>
            "$SW_APP/Screenwall.command" >"$RUNNER_TEMP/launcher-$1.log" 2>&1 </dev/null &
            launcher_pid=$!
            echo "SW_LAUNCHER_PID=$launcher_pid" >>"$GITHUB_ENV"
          }
          # 0: /health answered; 1: the launcher exited first; 2: no answer in 300 s.
          wait_health() {
            local deadline=$((SECONDS + 300))
            while [ "$SECONDS" -lt "$deadline" ]; do
              curl -sf -o /dev/null --max-time 3 "$SW_URL/health" && return 0
              kill -0 "$launcher_pid" 2>/dev/null || return 1
              sleep 2
            done
            return 2
          }
          show_logs() {
            for log in "$RUNNER_TEMP"/launcher-*.log "$SCREENWALL_HOME/logs/server.log"; do
              [ -f "$log" ] || continue
              echo "----- $log (last 60 lines)"
              tail -n 60 "$log"
            done
          }

          started=$SECONDS
          start_launcher 1
          result=0
          wait_health || result=$?
          if [ "$result" = 1 ]; then
            # The launcher gives the server 90 s and tells the user to start it once more if the
            # first start is slower. Do the same once, and say so on the run.
            echo "::warning::First start: the launcher exited before /health answered (after $((SECONDS - started)) s). Starting it a second time, as its message tells users to."
            show_logs
            sleep 3
            start_launcher 2
            result=0
            wait_health || result=$?
          fi
          if [ "$result" != 0 ]; then
            show_logs
            if [ "$result" = 1 ]; then
              echo "::error::The launcher exited before /health answered"
            else
              echo "::error::/health did not answer within 300 s"
            fi
            exit 1
          fi
          message="/health answered $((SECONDS - started)) s after the first launcher start"
          echo "$message"
          echo "$(uname -m): $message" >>"$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        shell: bash
        run: |
          # The uv the launcher used (it looks in the same places), and the venv it built.
          uv_bin="$(command -v uv || true)"
          if [ -z "$uv_bin" ]; then
            for candidate in "$HOME/.local/bin/uv" "$HOME/.cargo/bin/uv"; do
              if [ -x "$candidate" ]; then
                uv_bin="$candidate"
                break
              fi
            done
          fi
          if [ -z "$uv_bin" ]; then
            echo "::error::uv not found after the launcher ran"
            exit 1
          fi
          status=0
          UV_PROJECT_ENVIRONMENT="$SCREENWALL_HOME/venv" \
            "$uv_bin" run --no-sync --project "$SW_APP/app/backend" \
            python packaging/smoke_test.py --base-url "$SW_URL" --wait 60 \
            --expect-auditor unavailable --launch-token-file "$SCREENWALL_HOME/launch-token" \
            >"$RUNNER_TEMP/smoke-summary.json" || status=$?
          cat "$RUNNER_TEMP/smoke-summary.json"
          {
            echo "### Smoke test, ${{ matrix.os }} (exit $status)"
            echo '```json'
            cat "$RUNNER_TEMP/smoke-summary.json"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Stop the launcher
        if: always()
        shell: bash
        run: |
          # TERM: the launcher's trap stops the server it started (uv passes it on to uvicorn).
          if [ -n "${SW_LAUNCHER_PID:-}" ] && kill -0 "$SW_LAUNCHER_PID" 2>/dev/null; then
            kill -TERM "$SW_LAUNCHER_PID" || true
            for _ in $(seq 1 30); do
              kill -0 "$SW_LAUNCHER_PID" 2>/dev/null || break
              sleep 1
            done
          fi
          exit 0

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/launcher-*.log
            ${{ runner.temp }}/smoke-summary.json
            ${{ env.SCREENWALL_HOME }}/logs/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: draft release
    needs: smoke
    # Tags only: a manual run on a branch stops after the smoke tests.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: screenwall-release
          path: dist

      - name: Check the assets
        shell: bash
        working-directory: dist
        run: |
          ls -l
          for asset in Screenwall-macOS.zip install-macos.sh SHA256SUMS.txt; do
            [ -f "$asset" ] || { echo "::error::missing asset $asset"; exit 1; }
          done
          # Exactly these three files are attached to the release (dist/*).
          expected='Screenwall-macOS\.zip|install-macos\.sh|SHA256SUMS\.txt'
          extra="$(ls -A | grep -vxE "$expected" || true)"
          if [ -n "$extra" ]; then
            echo "::error::unexpected files in the release assets: $extra"
            exit 1
          fi
          sha256sum -c SHA256SUMS.txt

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A release for $TAG already exists; nothing was changed."
            exit 1
          fi
          cat >"$RUNNER_TEMP/notes.md" <<EOF
          Screenwall $TAG: belgelerdeki kişisel verileri kendi bilgisayarınızda maskeleyen uygulama.

          Bu sürüm yalnız macOS içindir: Apple Silicon ve Intel Mac'ler, macOS 14 (Sonoma) veya üstü. Windows desteklenmiyor.

          İndirme ve kurulum adımları README'nin "İndir" bölümünde: $repo_url#indir

          - Screenwall-macOS.zip: uygulama. Zip'i açın, Screenwall klasöründeki Screenwall.command dosyasına çift tıklayın.
          - install-macos.sh: terminalden kurulum. Zip'i indirir, SHA256SUMS.txt ile doğrular, ~/Screenwall klasörüne kurar ve başlatır.
          - SHA256SUMS.txt: dosyaların SHA-256 özetleri.

          Ollama zorunlu. Belgeler yalnızca yerel denetçi (Ollama üzerinde qwen3.5:4b modeli, yaklaşık 3,4 GB) çalıştığında onaylanabilir; Ollama yoksa uygulama açılır ve belgeleri maskeler, ama hiçbir belge onaylanamaz ve indirilemez. Ollama'yı https://ollama.com/download adresinden kurun; model ilk açılışta kendiliğinden indirilir. İlk açılışta gerekli paketler de indirilir; internet bağlantısı gerekir.

          Intel Mac'lerde Ollama yalnız işlemciyle (CPU) çalışır, denetim daha yavaş olur. Denetçi bir belgeye en fazla 120 saniye ayırır; süre aşılırsa belge incelemede kalır, elle onay da denetimi yeniden çalıştırdığı için süreyi hep aşan bir belge onaylanamaz. Intel'de bu sürenin yetip yetmediği ölçülmedi: Intel için tek test aşağıdaki Ollama'sız duman testi; Intel'de Ollama ile onay hiç denenmedi.

          İlk açılışta macOS uyarısı: uygulama imzasız olduğu için macOS "açılamadı" ya da "geliştirici doğrulanamadı" diyebilir. Screenwall.command dosyasına sağ tıklayın (ya da Control tuşuyla tıklayın) > Aç > Aç. macOS 15 (Sequoia) ve sonrasında bu yol çalışmazsa uyarıyı kapatın, Sistem Ayarları > Gizlilik ve Güvenlik bölümünde Screenwall.command satırındaki "Yine de Aç" düğmesine basın. Bu yalnızca ilk açılışta gerekir.

          Otomatik duman testi (zip açılır, başlatıcı çalıştırılır, sunucu ve örnek bir belge yüklemesi denenir; Ollama olmadan) GitHub'ın Apple Silicon (macos-latest) ve Intel (macos-15-intel) macOS sunucularında geçti. Bu taslağı oluşturan CI çalışması: $repo_url/actions/runs/$GITHUB_RUN_ID
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Screenwall $TAG" --notes-file "$RUNNER_TEMP/notes.md"
