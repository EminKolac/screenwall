[project]
name = "anonymizer-backend"
version = "0.1.0"
description = "Bilingual (TR/EN) document anonymization platform — backend"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # extraction
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    # anonymization
    "presidio-analyzer>=2.2.358",
    "presidio-anonymizer>=2.2.358",
    "spacy>=3.7",
    # spaCy models pinned as URL deps so `uv sync` installs + keeps them (no separate download step)
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "xx_ent_wiki_sm @ https://github.com/explosion/spacy-models/releases/download/xx_ent_wiki_sm-3.8.0/xx_ent_wiki_sm-3.8.0-py3-none-any.whl",
    # language detection
    "langdetect>=1.0.9",
    # local auditor + http
    "httpx>=0.27",
]

[project.optional-dependencies]
# Turkish NER via transformers (heavier: torch). Install for full TR support.
tr = ["transformers>=4.40", "torch>=2.2"]
# External chat providers (post-approval only)
chat = ["openai>=1.30", "anthropic>=0.34"]
# Optional fastText language id
fasttext = ["fasttext-wheel>=0.9.2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "httpx>=0.27"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
